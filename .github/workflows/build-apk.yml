name: Build MMCN Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build MMCN APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Setup Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 4. Install Dependencies
      - name: Install Dependencies
        run: npm install

      # 5. Check Required Files
      - name: Validate Project
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

      # 6. Create Android Platform
      - name: Create Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 7. Sync Capacitor
      - name: Sync Android
        run: npx cap sync android

      # 8. Build APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 9. Verify APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK")

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK file is empty!"
            exit 1
          fi

          echo "APK successfully created."
          ls -lh "$APK"

      # 10. Prepare APK
      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/MMCN-debug.apk

      # 11. Upload APK to Actions Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMCN-debug-apk
          path: release/MMCN-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 12. Create GitHub Release and Upload APK
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mmcn-build-${{ github.run_number }}
          name: MMCN APK Build ${{ github.run_number }}
          body: |
            MMCN Android APK

            Build: ${{ github.run_number }}

            APK: MMCN-debug.apk

            Note:
            This build contains the current MMCN application interface.
            Real offline voice calling, hotspot control and
            multi-router networking require further development.
          files: release/MMCN-debug.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
